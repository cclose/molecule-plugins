    defaultCloudInitType: "cloudInitNoCloud"
    defaultCores: "2"
    defaultDiskAccessMode: 'ReadWriteMany'
    defaultDiskSize: "10Gi"
    defaultDiskType: "virtio"
    defaultDiskVolumeMode: "Block"
    defaultInterfaceType: "virtio"
    defaultInterfaceName: "enp1s0"
    defaultMachineType: "q35"
    defaultMemory: "2Gi"
    defaultNamespace: "default"
    # maths
