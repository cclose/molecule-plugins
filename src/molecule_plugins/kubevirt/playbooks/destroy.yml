---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log | default(false) }}"
  vars:
    run_config_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/run-config.yml"
    kubeconfig_path: "{{ molecule_yml.driver.kubeconfig | realpath }}"
    instances: "{{ molecule_yml.platforms }}"

  tasks:
    - name: Load Run Config (if exists)
      kubevirt_driver_run_config:
        action: load
        path: "{{ run_config_path }}"
      register: run_config

    - name: Set Run Config
      ansible.builtin.set_fact:
        run_config: "{{ run_config.run_config }}"

    - name: Load Instance Config
      kubevirt_driver_instance_config:
        action: load
        path: "{{ molecule_instance_config }}"
      register: instance_config

    - name: Process Instance and Platform Data
      kubevirt_driver_process_instance_data:
        action: prepare
        instance_config: "{{ instance_config.instance_config }}"
        platform_config: "{{ instances }}"
        run_config: "{{ run_config }}"
      register: instance_data

    - name: Destroy Instance
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: VirtualMachine
        namespace: "{{ instance.namespace | default(defaultNamespace) }}"
        state: absent
        definition:
          metadata:
            name: "{{ instance.pod_name }}"
      register: server
      loop: "{{ instance_data.instance_data }}"
      loop_control:
        index_var: instance_index
        loop_var: instance

    # For an explanation of this Loop structure, see Create Secondary Drive(s) task
    # in Create.yml playbook

    - name: Destroy Drive(s)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ instance.namespace | default(defaultNamespace) }}"
        state: absent
        definition:
          metadata:
            name: "{{ disk.name }}"
      loop: "{{ instance_data.instance_data | subelements('pvcs', skip_missing=True) }}"
      loop_control:
        loop_var: instance_and_disk
      vars:
        instance: "{{ instance_and_disk[0] }}"  # The main item
        disk: "{{ instance_and_disk[1] }}"      # The subelement

    # Mandatory configuration for Molecule to function.
    - name: Clear Instance Configs
      ansible.builtin.set_fact:
        instance_conf: { }

    - name: Dump Instance Config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          {{ instance_conf | to_json | from_json | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
      when: server.changed | default(false) | bool  # noqa no-handler

    - name: Clear Run Config
      ansible.builtin.file:
        path: "{{ run_config_path }}"
        state: absent
