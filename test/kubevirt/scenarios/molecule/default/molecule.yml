dependency:
  name: galaxy
driver:
  name: custom-kubevirt
  kubeconfig: ../harvester.yaml

platforms:
  - name: default
    rootFsStorageClass: "longhorn-image-pqsf2"
    rootFsName: root-fs
    namespace: harvester-public
    interfaceMultus: hp-untagged
    cloudInit:
      userData: |
            #cloud-config
            password: molecule
            chpasswd: { expire: False }
            ssh_pwauth: True
            package_update: true
            package_upgrade: true
    
            chpasswd:
              list: |
                ubuntu:ubuntu
              expire: false
    
            packages:
              - curl
              - git
              - openssl
              - python3
              - python3-apt
              - qemu-guest-agent
              - wget
            runcmd:
              - - systemctl
                - enable
                - --now
                - qemu-guest-agent.service
            ssh_authorized_keys:
              - SSH_PUBLIC_KEY

      networkData: |
        network:
          version: 2
          ethernets:
            enp1s0:
              dhcp4: true
              gateway4: 10.1.250.1
              nameservers:
                addresses:
                  - 10.1.250.222
                  - 10.1.20.20
                  - 8.8.8.8
                  - 8.8.4.4
provisioner:
  name: ansible
verifier:
  name: ansible